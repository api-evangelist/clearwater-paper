notes: >-
  Clearwater Paper is a paperboard and tissue manufacturer and publishes no API product, developer
  program, or API pricing. Searched 2026-09-19: the corporate site (a Q4 Inc. investor-relations
  platform) has no developer, pricing, or plans section; the Customer Login page describes a "secure
  customer web portal" for existing customers without naming or linking it; and the Contact Us page
  routes every inquiry (paperboard, tissue, supplier, HR, investor) through a web form. The
  developer.clearwaterpaper.com and api.clearwaterpaper.com hosts named in an earlier stub of this
  record do not exist in DNS. This replaces a 2026-05-04 bulk-sweep artifact that listed a single
  "Enterprise Partner / contact sales" plan the provider never published (roadmap#35).
