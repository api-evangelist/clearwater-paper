description: >-
  Clearwater Paper Corporation (NYSE: CLW) is a Spokane, Washington-based manufacturer of bleached
  paperboard for North American packaging converters and, historically, private-label tissue for
  retailers. It is a Fortune 1000 company with mills in Idaho, Arkansas and Georgia. Clearwater Paper
  publishes no public API, developer program, SDK, or machine-readable contract: its corporate site
  is an investor-relations platform with a customer-login landing page that describes, but does not
  name or link, a secure customer web portal, and the api./developer. hostnames an earlier version of
  this record pointed at do not exist in DNS. Trading-partner EDI (X12 850/810/856/997) is offered
  only through third-party VAN and integration vendors, not from a Clearwater Paper developer surface.
